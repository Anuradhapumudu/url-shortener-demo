spring.application.name=url-shortener-demo
# Render sets PORT; locally it's 8090
server.port=${PORT:8090}

# Reads DB_URL, DB_USERNAME, DB_PASSWORD, SHORT_LINK_BASEURL from .env in the project folder
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# The jar stamps every file with a fixed 1980 date, so Last-Modified never changes and browsers keep a stale page.
# Disable it and make browsers re-check the page every time.
spring.web.resources.cache.use-last-modified=false
spring.web.resources.cache.cachecontrol.no-cache=true

# Creates the short_link table on startup (schema-mysql.sql)
spring.sql.init.mode=always
spring.sql.init.platform=mysql

# In production this would be e.g. https://go.workroo.click
short.link.base-url=${SHORT_LINK_BASEURL:http://localhost:8090}
short.link.code-length=8
# Empty = anyone can shorten any link. For Workroo production, restrict to our own hosts so nobody can use it for spam/phishing:
# short.link.allowed-hosts=workroo.click,prd.awsclient.s3-website-ap-southeast-2.amazonaws.com
short.link.allowed-hosts=${SHORT_LINK_ALLOWED_HOSTS:}

# --- Security / abuse controls ---
# Shared secret for /api/** (send as X-API-Key). Blank = open API, which the prod profile refuses to start with.
short.link.api-key=${SHORT_LINK_API_KEY:}
short.link.tenant-id=${SHORT_LINK_TENANT_ID:}
short.link.demo-ui-enabled=true
short.link.create-rate-limit-per-minute=30
# Redirect lookups are cached in memory; a deleted link can still redirect on other instances for up to this long
short.link.link-cache-ttl-seconds=30
# 0 = links never expire unless the request sets expiresInDays
short.link.default-expires-in-days=0
short.link.miss-throttle-per-minute=20

# --- Operations ---
# Tomcat only trusts X-Forwarded-* from loopback/private proxies, so clients cannot spoof their IP
server.forward-headers-strategy=native
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
# Fail fast when the DB is down instead of hanging the redirect
spring.datasource.hikari.connection-timeout=3000
management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
