services:
  - type: web
    name: url-shortener-demo
    runtime: docker
    # "free" instances sleep, which breaks every SMS link sent. Use a paid always-on plan.
    plan: starter
    healthCheckPath: /actuator/health/readiness
    envVars:
      # Set these in the Render dashboard (they are never stored in the repo)
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: SHORT_LINK_BASEURL
        sync: false
      - key: SHORT_LINK_ALLOWED_HOSTS
        sync: false
      - key: SHORT_LINK_API_KEY
        generateValue: true
      - key: SPRING_PROFILES_ACTIVE
        value: prod
